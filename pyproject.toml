[project]
name = "invoice-collector-web"
version = "0.1.0"
description = "Collecte semi-automatique de factures fournisseur depuis des portails web avec Playwright."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Internal Finance Automation" }]
dependencies = [
  "playwright>=1.44.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
  "pandas>=2.2.0",
  "typer>=0.12.3",
  "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[project.scripts]
invoice-collector = "invoice_collector.cli:app"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
